{% load staticfiles %}

<div id="step" style="display:none">{{step}}</div>
<div id="sim_code" style="display:none">{{sim_code}}</div>
<div id="persona_name_list" style="display:none">{{persona_name_str}}</div>
<div id="persona_init_pos" style="display:none">
	{% for i in persona_init_pos %}
		<span>{{i.0}},{{i.1}},{{i.2}}</span>
	{% endfor %}
</div>

<script type="text/javascript">
	/*
	  Main resources: 
	  https://www.youtube.com/watch?v=cKIG1lKwLeo&t=401s&ab_channel=HongLy
	  For the ground zero code, see the exported files from here: 
	  https://codepen.io/mikewesthad/pen/BVeoYP?editors=1111 

	  Also worth taking a look: 
	  https://www.youtube.com/watch?v=fdXcD9X4NrQ&ab_channel=MorganPage
	  and 
	  https://www.youtube.com/watch?v=MR2CvWxOEsw&ab_channel=MattWilber
	 */


	// ###########################################################################
	// PREAMBLE
	// ###########################################################################

	// <step> -- one full loop around all three phases determined by <phase> is 
	// a step. We use this to link the steps in the backend. 
	let step = parseInt(document.getElementById('step').innerHTML);
	let sim_code = document.getElementById('sim_code').innerHTML;
	// let persona_names = document.getElementById('persona_name_list').innerHTML.split(",");

	let spans = document.getElementById('persona_init_pos').getElementsByTagName('span');
	let persona_names = {};
	for(var i = 0, l = spans.length; i < l; i++){
		let x = spans[i].innerText.split(",");
		persona_names[x[0]] = [parseInt(x[1]), parseInt(x[2])]
	}


	// Phaser 3.0 global settings. 
	// Configuration meant to be passed to the main Phaser game instance. 
	const config = {
	  type: Phaser.AUTO,
	  width: window.innerWidth,
	  height: window.innerHeight,
	  parent: "game-container",
	  scale: {
	    mode: Phaser.Scale.RESIZE,
	    autoCenter: Phaser.Scale.NO_CENTER,
	    width: window.innerWidth,
	    height: window.innerHeight,
	  },
	  pixelArt: true,
	  physics: {
	    default: "arcade",
	    arcade: {
	      gravity: { y: 0 } } },
	  scene: {
	    preload: preload,
	    create: create,
	    update: update } };

	// Creating the game instance and setting up the main Phaser variables that  
	// will be used in it. 
	const game = new Phaser.Game(config);

	window.addEventListener('resize', function () {
		if (game) {
			game.scale.resize(window.innerWidth, window.innerHeight);
		}
	});
	let cursors;
	let player;
	let showDebug = false;

	// Persona related variables. This should have the name of the persona as its 
	// keys, and the instances of the Persona class as the values.
	var spawn_tile_loc = {};
	// for (var i = 0; i < persona_names.length; i++) { 
	// 	spawn_tile_loc[persona_names[i]] = [0, 0]
	// }

	for (var key in persona_names){
		spawn_tile_loc[key] = persona_names[key] ;
	}
	console.log(spawn_tile_loc);

	var personas = {};
	var pronunciatios = {};
	let anims_direction;
	let pre_anims_direction;
	let pre_anims_direction_dict = {};

	let curr_maze = "the_ville";

	// <tile_width> is the width of one individual tile (tiles are square)
	let tile_width = 32;
	// Important: tile_width % movement_speed has to be 0. 
	// <movement_speed> determines how fast we move at each upate cylce. 
	let movement_speed = 32; 

	let last_query_time = 0;
	let movement_poll_interval_ms = 500;
	let frontend_heartbeat_interval_ms = 2000;
	let last_heartbeat_time = 0;

	// <phase> -- there are three phases: "process," "update," and "execute."
	let phase = "update"; // or "update" or "execute"
	let is_paused = false;
	let focus_persona_target = "";
	window.setFocusPersona = function(name) {
		focus_persona_target = name;
	};

	let mapChatMessages = [];
	const mapChatMessageLimit = 80;
	const mapChatPollIntervalMs = 1200;
	let dialogueInitiators = {};
	let mapChatSeenKeys = {};
	let lastMapChatPollAt = 0;

	function buildMapChatMessageKey(speaker, utterance, dialogueId, explicitKey) {
	  const providedKey = String(explicitKey || "").trim();
	  if (providedKey) {
	    return providedKey;
	  }
	  const speakerText = String(speaker || "").trim();
	  const utteranceText = String(utterance || "").trim();
	  const dlgId = String(dialogueId || "").trim();
	  return [dlgId, speakerText, utteranceText].join("::");
	}

	function appendMapChatMessage(speaker, utterance, dialogueId, messageKey) {
	  const speakerText = String(speaker || "").trim();
	  const utteranceText = String(utterance || "").trim();
	  if (!speakerText || !utteranceText) {
	    return;
	  }

	  let dlgId = dialogueId || "";
	  if (!dlgId) {
	    dlgId = "temp_dlg";
	  }

	  if (!dialogueInitiators[dlgId]) {
	    dialogueInitiators[dlgId] = speakerText;
	  }

	  const dedupeKey = buildMapChatMessageKey(speakerText, utteranceText, dlgId, messageKey);
	  if (mapChatSeenKeys[dedupeKey]) {
	    return;
	  }
	  mapChatSeenKeys[dedupeKey] = true;

	  const isInitiator = (dialogueInitiators[dlgId] === speakerText);
	  const side = isInitiator ? "left" : "right";

	  mapChatMessages.push({
	    speaker: speakerText,
	    utterance: utteranceText,
	    side: side,
	    dialogueId: dlgId,
	    key: dedupeKey
	  });

	  if (mapChatMessages.length > mapChatMessageLimit) {
	    const removedMessage = mapChatMessages.shift();
	    if (removedMessage && removedMessage.key) {
	      delete mapChatSeenKeys[removedMessage.key];
	    }
	  }
	  renderMapChatFeed();
	}

	function renderMapChatFeed() {
	  const list = document.getElementById("map-chat-list");
	  if (!list) {
	    return;
	  }
	  list.innerHTML = "";
	  if (mapChatMessages.length === 0) {
	    const empty = document.createElement("div");
	    empty.className = "chat-hud__empty";
	    empty.textContent = "暂无 NPC 对话记录。";
	    list.appendChild(empty);
	    return;
	  }
	  mapChatMessages.slice(-12).forEach(function(message) {
	    const row = document.createElement("div");
	    row.className = "chat-row " + message.side;

	    const wrapper = document.createElement("div");
	    wrapper.className = "chat-bubble-wrapper";

	    // Avatar circle with HSL Hash Color
	    const avatar = document.createElement("div");
	    avatar.className = "chat-avatar";
	    avatar.setAttribute("data-name", message.speaker);
	    avatar.textContent = message.speaker.charAt(0).toUpperCase();

	    let hash = 0;
	    for (let i = 0; i < message.speaker.length; i++) {
	      hash = message.speaker.charCodeAt(i) + ((hash << 5) - hash);
	    }
	    const h = Math.abs(hash % 360);
	    avatar.style.backgroundColor = 'hsl(' + h + ', 60%, 45%)';

	    // Content wrapper
	    const content = document.createElement("div");
	    content.className = "chat-bubble-content";

	    const nameSpan = document.createElement("span");
	    nameSpan.className = "chat-sender-name";
	    nameSpan.textContent = message.speaker;

	    const bubble = document.createElement("div");
	    bubble.className = "chat-bubble";
	    bubble.textContent = message.utterance;

	    content.appendChild(nameSpan);
	    content.appendChild(bubble);

	    wrapper.appendChild(avatar);
	    wrapper.appendChild(content);
	    row.appendChild(wrapper);

	    list.appendChild(row);
	  });
	  list.scrollTop = list.scrollHeight;
	}

		function updateMapChatFeed(movementPayload) {
		  if (!movementPayload || !movementPayload["persona"]) {
		    return;
		  }
		  Object.keys(movementPayload["persona"]).forEach(function(personaName) {
		    const personaData = movementPayload["persona"][personaName];
		    const chatTurns = Array.isArray(personaData && personaData["chat"]) ? personaData["chat"] : [];
		    
		    if (chatTurns.length > 0) {
		      const speakers = [];
		      chatTurns.forEach(function(t) {
		        if (Array.isArray(t) && t.length >= 2 && !speakers.includes(t[0])) {
		          speakers.push(t[0]);
		        }
		      });
		      if (speakers.includes("User")) {
		        return;
		      }
		      const dlgId = "dlg_" + speakers.sort().join("_").replace(/ /g, "_");

	      chatTurns.forEach(function(turn, index) {
	        if (Array.isArray(turn) && turn.length >= 2) {
	          appendMapChatMessage(turn[0], turn[1], dlgId, dlgId + ":" + index);
	        }
	      });
	    }
	  });
	}

		function fetchMapChatTranscript() {
		  const currentStep = Number.isFinite(step) ? step : 0;
		  const url = "{% url 'api_get_chat_transcript' %}" +
		    "?sim_code=" + encodeURIComponent(sim_code) +
		    "&step=" + encodeURIComponent(currentStep) +
		    "&limit=24" +
		    "&channel=social";
	  return fetch(url)
	    .then(function(response) {
	      if (!response.ok) {
	        throw new Error("chat transcript request failed");
	      }
	      return response.json();
	    })
	    .then(function(data) {
	      const messages = Array.isArray(data.messages) ? data.messages : [];
	      messages.forEach(function(message) {
	        appendMapChatMessage(
	          message.speaker,
	          message.utterance,
	          message.dialogue_id || message.key,
	          message.key
	        );
	      });
	    })
	    .catch(function(error) {
	      console.error("Failed to load chat transcript:", error);
	    });
	}

	function loadInitialMapChatFeed() {
	  fetchMapChatTranscript();
	}

	function pollMapChatTranscript() {
	  const now = Date.now();
	  if (now - lastMapChatPollAt < mapChatPollIntervalMs) {
	    return;
	  }
	  lastMapChatPollAt = now;
	  fetchMapChatTranscript();
	}

	loadInitialMapChatFeed();

	// Variables for storing movements that are sent from the backend server.
	let execute_movement;
	let execute_count_max = tile_width/movement_speed;
	let execute_count = execute_count_max;
	let movement_target = {};
	

	// ###########################################################################
	// ENGINE
	// ###########################################################################

	// Joon: Phaser 3.0 is oriented around "scenes" -- recall how Pokemon plays: 
	//       there is the outdoor space, and then there is the indoor space; when
	//       you go inside, you transition to a new "scene" and the outdoor space
	//       basically disappears. 
	//       A scene in Phaser has four key methods that are called at different
	//       stages of rendering for different purposes. They are: 
	//       init() -> preload() -> create() -> update()
	//         init() is called only once at the very beginning. This is the 
	//           initialization function in case that is needed. 
	//         preload() is called once and preloads any of the assets
	//         create() is also called once after preloading... creates sprites 
	//           and actually displays stuff
	//         update() is called on each frame during the game play 

	function preload() {  
	  // Loading the necessary images (e.g., the background image, character 
	  // sprites). 

	  // Joon: for load.image, the first parameter is simply the key value that
	  //       you are passing in. The second parameter should be pointed to the
	  //       png file that contains the tileset. 
	  //       Also IMPORTANT: when you create a tileset in Tiled, always be  
	  //       sure to check the "embedded" option. 
	  this.load.image("blocks_1", "{% static 'assets/the_ville/visuals/map_assets/blocks/blocks_1.png' %}");
	  this.load.image("walls", "{% static 'assets/the_ville/visuals/map_assets/v1/Room_Builder_32x32.png' %}");
	  this.load.image("interiors_pt1", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt1.png' %}");
	  this.load.image("interiors_pt2", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt2.png' %}");
	  this.load.image("interiors_pt3", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt3.png' %}");
	  this.load.image("interiors_pt4", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt4.png' %}");
	  this.load.image("interiors_pt5", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt5.png' %}");
	  this.load.image("CuteRPG_Field_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Field_B.png' %}");
	  this.load.image("CuteRPG_Field_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Field_C.png' %}");
	  this.load.image("CuteRPG_Harbor_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Harbor_C.png' %}");
	  this.load.image("CuteRPG_Village_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Village_B.png' %}");
	  this.load.image("CuteRPG_Forest_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Forest_B.png' %}");
	  this.load.image("CuteRPG_Desert_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Desert_C.png' %}");
	  this.load.image("CuteRPG_Mountains_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Mountains_B.png' %}");
	  this.load.image("CuteRPG_Desert_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Desert_B.png' %}");
	  this.load.image("CuteRPG_Forest_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Forest_C.png' %}");

	  // Joon: This is the export json file you get from Tiled. 
	  this.load.tilemapTiledJSON("map", "{% static 'assets/the_ville/visuals/the_ville_jan7.json' %}");

	  // An atlas is a way to pack multiple images together into one texture. I'm 
	  // using it to load all the player animations (walking left, walking right, 
	  // etc.) in one image. For more info see:
	  // https://labs.phaser.io/view.html?src=src/animation/texture%20atlas%20animation.js
	  // If you don't use an atlas, you can do the same thing with a spritesheet, 
	  // see: https://labs.phaser.io/view.html?src=src/animation/single%20sprite%20sheet.js
	  // Joon: Technically, I think this guy had the best tutorial for atlas: 
	  //       https://www.youtube.com/watch?v=fdXcD9X4NrQ&ab_channel=MorganPage
	  this.load.atlas("atlas",
	                  "{% static 'assets/characters/Yuriko_Yamamoto.png' %}",
	                  "{% static 'assets/characters/atlas.json' %}");
	}

	function create() {  
	  const map = this.make.tilemap({ key: "map" });
	  // Joon: Logging map is really helpful for debugging here: 
	  //       console.log(map);

	  // The first parameter is the name you gave to the tileset in Tiled and then
	  // the key of the tileset image in Phaser's cache (i.e. the name you used in
	  // preload)
	  // Joon: for the first parameter here, really take a look at the 
	  //       console.log(map) output. You need to make sure that the name 
	  //       matches.
	  const collisions = map.addTilesetImage("blocks", "blocks_1");
	  const walls = map.addTilesetImage("Room_Builder_32x32", "walls");
	  const interiors_pt1 = map.addTilesetImage("interiors_pt1", "interiors_pt1");
	  const interiors_pt2 = map.addTilesetImage("interiors_pt2", "interiors_pt2");
	  const interiors_pt3 = map.addTilesetImage("interiors_pt3", "interiors_pt3");
	  const interiors_pt4 = map.addTilesetImage("interiors_pt4", "interiors_pt4");
	  const interiors_pt5 = map.addTilesetImage("interiors_pt5", "interiors_pt5");
	  const CuteRPG_Field_B = map.addTilesetImage("CuteRPG_Field_B", "CuteRPG_Field_B");
	  const CuteRPG_Field_C = map.addTilesetImage("CuteRPG_Field_C", "CuteRPG_Field_C");
	  const CuteRPG_Harbor_C = map.addTilesetImage("CuteRPG_Harbor_C", "CuteRPG_Harbor_C");
	  const CuteRPG_Village_B = map.addTilesetImage("CuteRPG_Village_B", "CuteRPG_Village_B");
	  const CuteRPG_Forest_B = map.addTilesetImage("CuteRPG_Forest_B", "CuteRPG_Forest_B");
	  const CuteRPG_Desert_C = map.addTilesetImage("CuteRPG_Desert_C", "CuteRPG_Desert_C");
	  const CuteRPG_Mountains_B = map.addTilesetImage("CuteRPG_Mountains_B", "CuteRPG_Mountains_B");
	  const CuteRPG_Desert_B = map.addTilesetImage("CuteRPG_Desert_B", "CuteRPG_Desert_B");
	  const CuteRPG_Forest_C = map.addTilesetImage("CuteRPG_Forest_C", "CuteRPG_Forest_C");

	  // The first parameter is the layer name (or index) taken from Tiled, the 
	  // second parameter is the tileset you set above, and the final two 
	  // parameters are the x, y coordinate. 
	  // Joon: The "layer name" that comes as the first parameter value  
	  //       literally is taken from our Tiled layer name. So to find out what
	  //       they are; you actually need to open up tiled and see how you 
	  //       named things there. 
	  let tileset_group_1 = [CuteRPG_Field_B, CuteRPG_Field_C, CuteRPG_Harbor_C, CuteRPG_Village_B, 
	  											 CuteRPG_Forest_B, CuteRPG_Desert_C, CuteRPG_Mountains_B, CuteRPG_Desert_B, CuteRPG_Forest_C,
	  											 interiors_pt1, interiors_pt2, interiors_pt3, interiors_pt4, interiors_pt5, walls];
	  const bottomGroundLayer = map.createLayer("Bottom Ground", tileset_group_1, 0, 0);
	  const exteriorGroundLayer = map.createLayer("Exterior Ground", tileset_group_1, 0, 0);
	  const exteriorDecorationL1Layer = map.createLayer("Exterior Decoration L1", tileset_group_1, 0, 0);
	  const exteriorDecorationL2Layer = map.createLayer("Exterior Decoration L2", tileset_group_1, 0, 0);
	  const interiorGroundLayer = map.createLayer("Interior Ground", tileset_group_1, 0, 0);
	  const wallLayer = map.createLayer("Wall", [CuteRPG_Field_C, walls], 0, 0);
	  const interiorFurnitureL1Layer = map.createLayer("Interior Furniture L1", tileset_group_1, 0, 0);
	  const interiorFurnitureL2Layer = map.createLayer("Interior Furniture L2 ", tileset_group_1, 0, 0);
	  const foregroundL1Layer = map.createLayer("Foreground L1", tileset_group_1, 0, 0);
	  const foregroundL2Layer = map.createLayer("Foreground L2", tileset_group_1, 0, 0);
	  foregroundL1Layer.setDepth(2);
	  foregroundL2Layer.setDepth(2);

	  const collisionsLayer = map.createLayer("Collisions", collisions, 0, 0);
	  // const groundLayer = map.createLayer("Ground", walls, 0, 0);
	  // const indoorGroundLayer = map.createLayer("Indoor Ground", walls, 0, 0);
	  // const wallsLayer = map.createLayer("Walls", walls, 0, 0);
	  // const interiorsLayer = map.createLayer("Furnitures", interiors, 0, 0);
	  // const builtInLayer = map.createLayer("Built-ins", interiors, 0, 0);
	  // const appliancesLayer = map.createLayer("Appliances", interiors, 0, 0);
	  // const foregroundLayer = map.createLayer("Foreground", interiors, 0, 0);

	  // Joon : This is where you want to create a custom field for the tileset
	  //        in Tiled. Take a look at this guy's tutorial: 
	  //        https://www.youtube.com/watch?v=MR2CvWxOEsw&ab_channel=MattWilber
	  collisionsLayer.setCollisionByProperty({ collide: true });
	  // By default, everything gets depth sorted on the screen in the order we 
	  // created things. Here, we want the "Above Player" layer to sit on top of 
	  // the player, so we explicitly give it a depth. Higher depths will sit on 
	  // top of lower depth objects.
	  // Collisions layer should get a negative depth since we do not want to see
	  // it. 
	  collisionsLayer.setDepth(-1);
	  // foregroundL1Layer.setDepth(2);
	  // foregroundL1Layer.setDepth(2);

	  // *** SET UP CAMERA *** 
	  // "player" is to be set as the center of mass for our "camera." We 
	  // basically create a game character sprite as we would for our personas 
	  // but we move it to depth -1 and let it pass through the collision map;  
	  // that is, do not have the following line: 
	  // this.physics.add.collider(player, collisionsLayer);
	  // OLD NOTE: Create a sprite with physics enabled via the physics system. 
	  // The image  used for the sprite has a bit of whitespace, so I'm using 
	  // setSize & setOffset to control the size of the player's body.
	  player = this.physics.add.
	                sprite(800, 288, "atlas", "down").
	                setSize(30, 40).
	                setOffset(0, 0);
	  player.setDepth(-1);
	  // Setting up the camera. 
	  const camera = this.cameras.main;
	  camera.startFollow(player);
	  camera.setBounds(0, 0, map.widthInPixels, map.heightInPixels);
	  cursors = this.input.keyboard.createCursorKeys();

	  // Camera mouse dragging logic
	  let dragState = null;
	  this.input.on('pointerdown', function (pointer) {
	    dragState = {
	      x: pointer.x,
	      y: pointer.y,
	      scrollX: camera.scrollX,
	      scrollY: camera.scrollY
	    };
	    camera.stopFollow();
	  });

	  this.input.on('pointermove', function (pointer) {
	    if (pointer.isDown && dragState) {
	      camera.scrollX = dragState.scrollX - (pointer.x - dragState.x);
	      camera.scrollY = dragState.scrollY - (pointer.y - dragState.y);
	    }
	  });

	  this.input.on('pointerup', function () {
	    dragState = null;
	  });

	  // *** SET UP PERSONAS *** 
	  // We start by creating the game sprite objects. 
	  for (let i=0; i<Object.keys(spawn_tile_loc).length; i++) { 
	    let persona_name = Object.keys(spawn_tile_loc)[i];
	    let start_pos = [spawn_tile_loc[persona_name][0] * tile_width + tile_width / 2, 
	                     spawn_tile_loc[persona_name][1] * tile_width + tile_width];
	    let new_sprite = this.physics.add
	                         .sprite(start_pos[0], start_pos[1], "atlas", "down")
	                         .setSize(30, 40)
	                         .setOffset(0, 32); // DEBUG 1 --- I added 32 offset on Dec 29. 
	    // Here, we are creating the persona and its pronunciatio sprites.
	    personas[persona_name] = new_sprite;
	    pronunciatios[persona_name] = this.add.text(
	                                   new_sprite.body.x - 6, 
	                                   new_sprite.body.y - 42 - 32, // DEBUG 1 --- I added 32 offset on Dec 29. 
	                                   "🦁", {
	                                   font: "28px monospace", 
	                                   fill: "#000000", 
	                                   padding: { x: 8, y: 8}, 
	                                   backgroundColor: "#ffffff",
	                                   border:"solid",
	                                   borderRadius:"10px"}).setDepth(3);

	    // Make sprite interactive (clickable)
	    new_sprite.setInteractive();
	    new_sprite.on('pointerdown', function() {
	      openChat(persona_name.replace(/ /g, "_"));
	    });
	  }

	  // Create the player's walking animations from the texture atlas. These are
	  // stored in the global animation manager so any sprite can access them.
	  const anims = this.anims;
	  anims.create({
	    key: "atlas-left-walk",
	    frames: anims.generateFrameNames("atlas", { prefix: "left-walk.", start: 0, end: 3, zeroPad: 3 }),
	    frameRate: 4,
	    repeat: -1 });

	  anims.create({
	    key: "atlas-right-walk",
	    frames: anims.generateFrameNames("atlas", { prefix: "right-walk.", start: 0, end: 3, zeroPad: 3 }),
	    frameRate: 4,
	    repeat: -1 });

	function update(time, delta) {

		if (is_paused) {
			// Stop all persona animations
			for (let i=0; i<Object.keys(personas).length; i++) {
				let curr_persona_name = Object.keys(personas)[i];
				personas[curr_persona_name].anims.stop();
			}
			player.body.setVelocity(0);
			return;
		}

	  pollMapChatTranscript();

	  // *** MOVE CAMERA *** 
	  // This is where we finish up the camera setting we started in the create() 
	  // function. We set the movement speed of the camera and wire up the keys to
	  // map to the actual movement.
	  const camera_speed = 400;
	  // Stop any previous movement from the last frame
	  player.body.setVelocity(0);

	  // If any arrow key is pressed, break the focus lock and follow the player again
	  if (cursors.left.isDown || cursors.right.isDown || cursors.up.isDown || cursors.down.isDown) {
	  	this.cameras.main.startFollow(player);
	  }

	  if (cursors.left.isDown) {
	    player.body.setVelocityX(-camera_speed);
	  } 
	  if (cursors.right.isDown) {
	    player.body.setVelocityX(camera_speed);
	  } 
	  if (cursors.up.isDown) {
	    player.body.setVelocityY(-camera_speed);
	  } 
	  if (cursors.down.isDown) {
	    player.body.setVelocityY(camera_speed);
	  }

	  // Check if camera needs to focus/lock on a persona
	  if (focus_persona_target !== "") {
	  	let target_sprite = personas[focus_persona_target];
	  	if (target_sprite) {
	  		this.cameras.main.startFollow(target_sprite);
	  		player.x = target_sprite.x;
	  		player.y = target_sprite.y;
	  	}
	  	focus_persona_target = "";
	  }

	  // console.log("phase: " + phase + ", step: " + step);
	// Heartbeat disabled for decoupled playback mode
	// let heartbeat_now = Date.now();
	// if (heartbeat_now - last_heartbeat_time >= frontend_heartbeat_interval_ms) {
	//   last_heartbeat_time = heartbeat_now;
	//   try {
	//     var heartbeat_xobj = new XMLHttpRequest();
	//     heartbeat_xobj.open('POST', "{% url 'api_frontend_heartbeat' %}", true);
	//     heartbeat_xobj.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
	//     heartbeat_xobj.send(JSON.stringify({"sim_code": sim_code, "step": step, "phase": phase}));
	//   } catch (e) {
	//     console.error("frontend heartbeat failed:", e);
	//   }
	// }

	  // *** MOVE PERSONAS ***
	  // Moving personas take place in three distinct phases: "process," "update,"
	  // and "execute." These phases are determined by the value of <phase>. 
	  // Only one of the three phases is incurred in each update cycle. 
	  if (phase == "process") {
	    // "process" takes all current locations of the personas and send them to
	    // the frontend server in a json form. Here, we first create the json 
	    // file that records all persona locations: 
	    let data = {"step": step, 
	    						"sim_code": sim_code,
	                "environment": {}}
	    for (let i=0; i<Object.keys(personas).length; i++) {
	      let persona_name = Object.keys(personas)[i];
	      data["environment"][persona_name] = {"maze": curr_maze,
	                                           "x": Math.ceil((personas[persona_name].body.position.x) / tile_width),
	                                           "y": Math.ceil((personas[persona_name].body.position.y) / tile_width)}
	    }
	    var json = JSON.stringify(data);
	    // We then send this to the frontend server: 
	    var retrieve_xobj = new XMLHttpRequest();
	    retrieve_xobj.overrideMimeType("application/json");
	    retrieve_xobj.open('POST', "{% url 'process_environment' %}", true);
	    retrieve_xobj.send(json);   
	    // Finally, we update the phase variable to start the "udpate" process. 
	    // Now that we sent all persona locations to the backend server, we need
	    // to wait until the backend determines what the personas will do next. 
	    phase = "update";
	  } 

	  else if (phase == "update") { 
	    // Update is where we * wait * for the backend server to finish 
	    // computing about what the personas will do next given their current 
	    // situation. 
	    // We do this by continuously asking the backend server if it is ready. 
	    // The backend server is ready when it returns a json that has a key-val
	    // pair with "<move>": true.
	    // Query more frequently so the browser does not visibly fall behind after
	    // backend movement for the current step is ready.
	    let now = Date.now();
	    if (now - last_query_time >= movement_poll_interval_ms) {
	      last_query_time = now;
	      var update_xobj = new XMLHttpRequest();
	      update_xobj.overrideMimeType("application/json");
	      update_xobj.open('POST', "{% url 'update_environment' %}", true);
	      update_xobj.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
	      update_xobj.addEventListener("load", function() {
	        if (this.readyState === 4) {
	          if (update_xobj.status === 200) {
	            let res = JSON.parse(update_xobj.responseText);
	            if (res["<step>"] == step) {
	              execute_movement = res;
	              phase = "execute";
	              movement_poll_interval_ms = 500; // 很快返回则0.5秒刷新一次
	            } else {
	              movement_poll_interval_ms = 1000; // 等待后端则1秒刷一次
	            }
	          }
	        }
	      });
	      update_xobj.send(JSON.stringify({"step": step, "sim_code": sim_code }));   
	    }
	  } 

	  else { 
	    // This is where we actually move the personas in the visual world. Each
	    // backend computation in execute_movement moves each persona by one tile
	    // (or some personas might not move if they choose not to). 
	    // The execute_count_max is computed by tile_width/movement_speed, which
	    // defines a one step sequence in this world. 
	    updateFlipClock(execute_movement["meta"]["curr_time"]);
	    for (let i=0; i<Object.keys(personas).length; i++) {
	      let curr_persona_name = Object.keys(personas)[i];
	      let curr_persona = personas[curr_persona_name];
	      let curr_pronunciatio = pronunciatios[Object.keys(personas)[i]];

	      if (execute_count == execute_count_max) { 
	        let curr_x = execute_movement["persona"][curr_persona_name]["movement"][0];
	        let curr_y = execute_movement["persona"][curr_persona_name]["movement"][1];
	        movement_target[curr_persona_name] = [curr_x * tile_width, 
	                                              curr_y * tile_width]; 
	        let pronunciatio_content = execute_movement["persona"][curr_persona_name]["pronunciatio"];
	        // This is what gives the pronunciatio balloon the name initials. We 
	        // use regex to extract the initials of the personas. 
	        // E.g., "Dolores Murphy" -> "DM"
	        let rgx = new RegExp(/(\p{L}{1})\p{L}+/, 'gu');
	        let initials = [...curr_persona_name.matchAll(rgx)] || [];
	        initials = (
	          (initials.shift()?.[1] || '') + (initials.pop()?.[1] || '')
	        ).toUpperCase();
	        pronunciatios[curr_persona_name].setText(initials + ": " + pronunciatio_content);
	      }

	      console.log(curr_persona_name);
	      if (execute_count > 0) {
	        if (curr_persona.body.x < movement_target[curr_persona_name][0]) {
	          curr_persona.body.x += movement_speed; 
	          anims_direction = "r";
	          pre_anims_direction = "r"
	          pre_anims_direction_dict[curr_persona_name] = "r"
	        } else if (curr_persona.body.x > movement_target[curr_persona_name][0]) {
	          curr_persona.body.x -= movement_speed; 
	          anims_direction = "l";
	          pre_anims_direction = "l"
	          pre_anims_direction_dict[curr_persona_name] = "l"
	        } else if (curr_persona.body.y < movement_target[curr_persona_name][1]) {
	          curr_persona.body.y += movement_speed;
	          anims_direction = "d";
	          pre_anims_direction = "d"
	          pre_anims_direction_dict[curr_persona_name] = "d"
	        } else if (curr_persona.body.y > movement_target[curr_persona_name][1]) {
	          curr_persona.body.y -= movement_speed;
	          anims_direction = "u";
	          pre_anims_direction = "u"
	          pre_anims_direction_dict[curr_persona_name] = "u"
	        } else {
	        	anims_direction = "";
	        }

	        curr_pronunciatio.x = curr_persona.body.x - 6; 
          curr_pronunciatio.y = curr_persona.body.y - 42 - 32; // DEBUG 1 --- I added 32 offset on Dec 29. 

          if (anims_direction == "l") {
			      curr_persona.anims.play("atlas-left-walk", true);
			    } else if (anims_direction == "r") {
			      curr_persona.anims.play("atlas-right-walk", true);
			    } else if (anims_direction == "u") {
			      curr_persona.anims.play("atlas-back-walk", true);
			    } else if (anims_direction == "d") {
			      curr_persona.anims.play("atlas-front-walk", true);
			    } else {
			      curr_persona.anims.stop();

			      // If we were moving, pick an idle frame to use
			      if (pre_anims_direction_dict[curr_persona_name] == "l") curr_persona.setTexture("atlas", "left");else
			      if (pre_anims_direction_dict[curr_persona_name] == "r") curr_persona.setTexture("atlas", "right");else
			      if (pre_anims_direction_dict[curr_persona_name] == "u") curr_persona.setTexture("atlas", "up");else
			      if (pre_anims_direction_dict[curr_persona_name] == "d") curr_persona.setTexture("atlas", "down");
			    };

	      } 
	      else {
	        // Once we are done moving the personas, we move on to the "process"
	        // stage where we will send the current locations of all personas at the
	        // end of the movemments to the frontend server, and then the backend.
	        for (let i=0; i<Object.keys(personas).length; i++) {
	          let curr_persona_name = Object.keys(personas)[i]
	          let curr_persona = personas[curr_persona_name];
	          curr_persona.body.x = movement_target[curr_persona_name][0];
	          curr_persona.body.y = movement_target[curr_persona_name][1];
	        }
	        phase = "update";
	        execute_count = execute_count_max + 1;
	        step = step + 1;
	        if (document.getElementById("clock-step")) {
	            document.getElementById("clock-step").innerText = "Step: " + step;
	        }
	        
	        // Dynamically update address bar URL to keep current step count on manual page refresh
	        try {
	          let current_url = window.location.pathname;
	          let parts = current_url.split("/");
	          if (parts.length >= 4) {
	            parts[3] = step;
	            let new_url = parts.join("/");
	            window.history.replaceState({}, '', new_url + window.location.search);
	          }
	        } catch (e) {
	          console.error("Failed to update history state:", e);
	        }
	      }
	    }

	    // Filling in the action description. 
	    if (execute_count == execute_count_max) { 
	      updateMapChatFeed(execute_movement);
	      pollMapChatTranscript();
	      for (let i=0; i<Object.keys(personas).length; i++) {
	      	let action_description = ""
	        let curr_persona_name = Object.keys(personas)[i];
	        let curr_persona_name_os = curr_persona_name.replace(/ /g,"_");
	        let persona_move = execute_movement["persona"][curr_persona_name];
	        let description_content = persona_move["description"];
	        let description_parts = description_content.split("@");
	        let action_text = description_parts[0] || "";
	        let address_text = description_parts.length > 1 ? description_parts[1] : "";
	        // action_description += description_content + "<br>";

	        document.getElementById("current_action__"+curr_persona_name_os).innerHTML = action_text;
	        document.getElementById("target_address__"+curr_persona_name_os).innerHTML = address_text;

	        // Update physiological status bars and values
	        let satiety_val = execute_movement["persona"][curr_persona_name]["satiety"];
	        let stamina_val = execute_movement["persona"][curr_persona_name]["stamina"];
	        let health_val = execute_movement["persona"][curr_persona_name]["health"];
	        let mood_val = execute_movement["persona"][curr_persona_name]["mood"];

	        if (satiety_val !== undefined) {

	        }
	        if (stamina_val !== undefined) {
	          document.getElementById("stamina_val__" + curr_persona_name_os).innerText = Math.round(stamina_val);
	          document.getElementById("stamina_bar__" + curr_persona_name_os).style.width = Math.round(stamina_val) + "%";
	        }
	        if (health_val !== undefined) {
	          document.getElementById("health_val__" + curr_persona_name_os).innerText = Math.round(health_val);
	          document.getElementById("health_bar__" + curr_persona_name_os).style.width = Math.round(health_val) + "%";
	        }
	        if (mood_val !== undefined) {
	          document.getElementById("mood_val__" + curr_persona_name_os).innerText = Math.round(mood_val);
	          document.getElementById("mood_bar__" + curr_persona_name_os).style.width = Math.round(mood_val) + "%";
	        }

	      }
	      
	    }

	    execute_count = execute_count - 1;
	  }
	}

// 当前对话状态
var chatState = {
  personaName: "",          // 下划线格式 e.g. "Isabella_Rodriguez"
  displayName: "",          // 空格格式 e.g. "Isabella Rodriguez"
  conversationHistory: [],  // 对话历史 [{role: "user"/"assistant", content: "..."}]
  isWaiting: false          // 是否正在等待回复

// Audio TTS state
var ttsEnabled = true;

function toggleTts() {
  ttsEnabled = !ttsEnabled;
  var btn = document.getElementById("chat-audio-toggle");
  if (ttsEnabled) {
    btn.innerHTML = "🔊 Audio: ON";
    btn.style.background = "#388E3C";
  } else {
    btn.innerHTML = "🔇 Audio: OFF";
    btn.style.background = "#D32F2F";
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
  }
}

function speakText(text, displayName) {
  if (!ttsEnabled || !('speechSynthesis' in window)) return;

  // Cancel any ongoing speech
  window.speechSynthesis.cancel();

  // Strip emojis and html if any
  var cleanText = text.replace(/[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF]/g, "");
  
  var utterance = new SpeechSynthesisUtterance(cleanText);
  utterance.lang = "zh-CN";

  // Check if character is singing (e.g. contains ♪, 唱, 歌, sing, song)
  var isSinging = /♪|唱|歌|sing|song/i.test(text);

  if (isSinging) {
    // Singing: higher pitch, slightly slower rate to sound melodic/rhythmic
    utterance.pitch = 1.35;
    utterance.rate = 0.82;
    console.log("=== [AI Singing] Synthesizing singing vocals for: " + displayName);
  } else {
    // Normal speech: standard parameters
    utterance.pitch = 1.0;
    utterance.rate = 1.05;
    console.log("=== [AI Speaking] Synthesizing speech for: " + displayName);
  }

  // Choose voice by gender / character name
  var voices = window.speechSynthesis.getVoices();
  if (voices && voices.length > 0) {
    var selectedVoice = null;
    var nameLower = displayName.toLowerCase();
    
    // Female characters
    if (nameLower.includes("isabella") || nameLower.includes("maria")) {
      // Find a female voice or a default Chinese voice
      selectedVoice = voices.find(function(v) { 
        return v.lang.includes("ZH") && (v.name.toLowerCase().includes("xiaoxiao") || v.name.toLowerCase().includes("female") || v.name.toLowerCase().includes("mei")); 
      });
    } else { // Male characters (Klaus etc.)
      selectedVoice = voices.find(function(v) { 
        return v.lang.includes("ZH") && (v.name.toLowerCase().includes("yunjian") || v.name.toLowerCase().includes("male") || v.name.toLowerCase().includes("kangkang")); 
      });
    }

    if (!selectedVoice) {
      // Fallback to any Chinese voice
      selectedVoice = voices.find(function(v) { return v.lang.includes("ZH") || v.lang.includes("zh"); });
    }

    if (selectedVoice) {
      utterance.voice = selectedVoice;
    }
  }

  window.speechSynthesis.speak(utterance);
}

function openChat(personaNameUnderscore) {
  chatState.personaName = personaNameUnderscore;
  chatState.displayName = personaNameUnderscore.replace(/_/g, " ");
  chatState.conversationHistory = [];
	  chatState.isWaiting = false;

	  document.getElementById("chat-persona-display-name").innerText = chatState.displayName;
	  document.getElementById("chat-messages").innerHTML = 
	    '<p style="color:#888; text-align:center; font-style:italic;">Send an admin query or instruction to ' + chatState.displayName + '...</p>';
  document.getElementById("chat-input").value = "";
  document.getElementById("chat-modal").style.display = "block";
  
  // Focus input
  setTimeout(function() {
    document.getElementById("chat-input").focus();
  }, 100);
}

function closeChat() {
  document.getElementById("chat-modal").style.display = "none";
  chatState.personaName = "";
  chatState.conversationHistory = [];
}

function appendMessage(role, content, personaName) {
  var messagesDiv = document.getElementById("chat-messages");
  
  // 如果是第一条消息，清除占位文字
  if (chatState.conversationHistory.length <= 1 && role === "user") {
    messagesDiv.innerHTML = "";
  }

  var msgDiv = document.createElement("div");
  msgDiv.style.marginBottom = "12px";
  msgDiv.style.display = "flex";
  msgDiv.style.flexDirection = "column";
  
  if (role === "user") {
    msgDiv.style.alignItems = "flex-end";
    msgDiv.innerHTML = 
      '<div style="background:#4CAF50; color:white; padding:8px 14px; border-radius:12px 12px 0 12px; max-width:80%; word-wrap:break-word;">' +
      escapeHtml(content) +
      '</div>' +
      '<span style="font-size:0.75em; color:#999; margin-top:2px;">You</span>';
  } else {
    msgDiv.innerHTML = 
      '<div style="background:#e8e8e8; color:#333; padding:8px 14px; border-radius:12px 12px 12px 0; max-width:80%; word-wrap:break-word;">' +
      escapeHtml(content) +
      '</div>' +
      '<span style="font-size:0.75em; color:#999; margin-top:2px;">' + escapeHtml(personaName || chatState.displayName) + '</span>';
  }
  
  messagesDiv.appendChild(msgDiv);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function showTypingIndicator() {
  var messagesDiv = document.getElementById("chat-messages");
  var typingDiv = document.createElement("div");
  typingDiv.id = "typing-indicator";
  typingDiv.style.marginBottom = "12px";
  typingDiv.innerHTML = 
    '<div style="background:#e8e8e8; color:#999; padding:8px 14px; border-radius:12px 12px 12px 0; display:inline-block;">' +
    '<span style="font-style:italic;">' + escapeHtml(chatState.displayName) + ' is thinking...</span>' +
    '</div>';
  messagesDiv.appendChild(typingDiv);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function removeTypingIndicator() {
  var el = document.getElementById("typing-indicator");
  if (el) el.remove();
}

function escapeHtml(text) {
  var div = document.createElement('div');
  div.appendChild(document.createTextNode(text));
  return div.innerHTML;
}

function inferMessageMode(message) {
  var text = (message || "").trim();
  if (/通知|提醒你|告诉你|仅供参考/.test(text)) return "notify";
  if (/[?？]$/.test(text) || /什么|为什么|情况|状态|计划|记得|关系|在哪|做什么/.test(text)) return "query";
  if (/先|去|请|不要|立刻|马上|停止|执行|帮我/.test(text)) return "instruction";
  return "query";
}

function getModeLabel(mode) {
  if (mode === "instruction") return "指令";
  if (mode === "notify") return "通知";
  return "询问";
}

function sendChatMessage() {
  if (chatState.isWaiting) return;
  
  var input = document.getElementById("chat-input");
  var message = input.value.trim();
  if (!message) return;

  // 清空输入框
  input.value = "";

  // 显示用户消息
  appendMessage("user", message);
  
  // 添加到历史
  chatState.conversationHistory.push({role: "user", content: message});

  // 禁用发送按钮
  chatState.isWaiting = true;
  var sendBtn = document.getElementById("chat-send-btn");
  sendBtn.disabled = true;
  sendBtn.style.opacity = "0.5";

  // 显示"正在思考"
  showTypingIndicator();

	  // 发送请求到后端
	  var xhr = new XMLHttpRequest();
	  xhr.open("POST", "{% url 'admin_console_with_persona' %}", true);
  xhr.setRequestHeader("Content-Type", "application/json");
  xhr.onload = function() {
    removeTypingIndicator();
    chatState.isWaiting = false;
    sendBtn.disabled = false;
    sendBtn.style.opacity = "1";

    if (xhr.status === 200) {
      var resp = JSON.parse(xhr.responseText);
      var reply = resp.reply;
      var replyWithMode = "[" + getModeLabel(resp.message_mode || inferMessageMode(message)) + "] " + reply;
      appendMessage("assistant", replyWithMode, resp.persona_name);
      chatState.conversationHistory.push({role: "assistant", content: reply});
      speakText(reply, chatState.displayName);
    } else {
      var errMsg = "Error: ";
      try {
        errMsg += JSON.parse(xhr.responseText).error;
      } catch(e) {
        errMsg += "Request failed (status " + xhr.status + ")";
      }
      appendMessage("assistant", errMsg, "System");
    }

    // 重新 focus 输入框
    input.focus();
  };
  xhr.onerror = function() {
    removeTypingIndicator();
    chatState.isWaiting = false;
    sendBtn.disabled = false;
    sendBtn.style.opacity = "1";
    appendMessage("assistant", "Error: Network request failed. Is the server running?", "System");
  };
  xhr.timeout = 180000;
  xhr.ontimeout = function() {
    removeTypingIndicator();
    chatState.isWaiting = false;
    sendBtn.disabled = false;
    sendBtn.style.opacity = "1";
    appendMessage("assistant", "Error: Request timed out. The LLM might be too slow.", "System");
  };

  xhr.send(JSON.stringify({
    sim_code: sim_code.trim(),
    persona_name: chatState.personaName,
    user_message: message,
    message_mode: inferMessageMode(message),
    conversation_history: chatState.conversationHistory.slice(0, -1) // 不含刚添加 of user message（后端会自己加）
  }));
}

	function getChineseDayOfWeek(dateString) {
	  try {
	    const days = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
	    const d = new Date(dateString);
	    if (isNaN(d.getTime())) {
	      const parts = dateString.split(',');
	      const cleanDate = parts[0] + ',' + parts[1];
	      const d2 = new Date(cleanDate);
	      return days[d2.getDay()] || "星期几";
	    }
	    return days[d.getDay()] || "星期几";
	  } catch (e) {
	    return "星期几";
	  }
	}

	function updateFlipClock(timeStr) {
	  if (!timeStr) return;
	  try {
	    const parts = timeStr.split(", ");
	    if (parts.length >= 3) {
	      const datePart = parts[0] + ", " + parts[1];
	      const timePart = parts[2];
	      const timeSplit = timePart.split(":");
	      if (timeSplit.length >= 2) {
	        const hour = timeSplit[0].padStart(2, '0');
	        const minute = timeSplit[1].padStart(2, '0');
	        
	        if (document.getElementById("clock-hour-1")) document.getElementById("clock-hour-1").textContent = hour[0];
	        if (document.getElementById("clock-hour-2")) document.getElementById("clock-hour-2").textContent = hour[1];
	        if (document.getElementById("clock-minute-1")) document.getElementById("clock-minute-1").textContent = minute[0];
	        if (document.getElementById("clock-minute-2")) document.getElementById("clock-minute-2").textContent = minute[1];
	        if (document.getElementById("clock-day-of-week")) document.getElementById("clock-day-of-week").textContent = getChineseDayOfWeek(datePart);
	      }
	    }
	  } catch (e) {
	    console.error("Failed to update clock HUD:", e);
	  }
	}

	// Play/Pause button binding
	const playPauseBtn = document.getElementById("clock-play-pause");
	const playPauseIcon = document.getElementById("play-pause-icon");
	if (playPauseBtn && playPauseIcon) {
	  playPauseBtn.onclick = function() {
	    is_paused = !is_paused;
	    if (is_paused) {
	      playPauseIcon.className = "glyphicon glyphicon-play";
	      playPauseBtn.title = "播放";
	      for (let i=0; i<Object.keys(personas).length; i++) {
	        let curr_persona_name = Object.keys(personas)[i];
	        personas[curr_persona_name].anims.stop();
	      }
	    } else {
	      playPauseIcon.className = "glyphicon glyphicon-pause";
	      playPauseBtn.title = "暂停";
	    }
	  };
	}

</script>
